[package]
name = "phenixrizen-zen-database-sqlite"
description = "Pure-Rust SQLite database handler for the ZEN engine"
license = "MIT"
version = "2.0.1"
edition = "2021"
authors = ["Phenix Rizen <phenixrizen@gmail.com>"]
repository = "https://github.com/phenixrizen/zen.git"
homepage = "https://github.com/phenixrizen/zen"

[features]
# Mirrors the workspace: the engine is built both ways in CI, so the driver must be too.
arbitrary_precision = ["zen-engine/arbitrary_precision", "zen-types/arbitrary_precision"]

[lib]
name = "zen_database_sqlite"

[dependencies]
zen-engine = { package = "phenixrizen-zen-engine", path = "../engine", version = "2.0.1" }
zen-types = { package = "phenixrizen-zen-types", path = "../types", version = "2.0.1" }
ahash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
# Pure-Rust SQLite: no C toolchain, no vendored amalgamation, wasm-capable.
turso = "0.7"

[dev-dependencies]
zen-expression = { package = "phenixrizen-zen-expression", path = "../expression", version = "2.0.1" }
zen-types = { package = "phenixrizen-zen-types", path = "../types", version = "2.0.1" }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
