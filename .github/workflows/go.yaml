name: Go
env:
  WORKING_DIRECTORY: bindings/c
  MACOSX_DEPLOYMENT_TARGET: '10.13'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bindings/c/**'
      - 'core/**'
      - 'test-data/**'
      - '.github/workflows/go.yaml'
  push:
    tags:
      - 'go-v*'

permissions: write-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: 'x86_64-apple-darwin'
          - host: macos-latest
            target: 'aarch64-apple-darwin'
          - host: ubuntu-latest
            target: 'x86_64-unknown-linux-gnu'
          - host: ubuntu-latest
            target: 'aarch64-unknown-linux-gnu'
          - host: ubuntu-latest
            target: 'x86_64-pc-windows-gnu'

    name: ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ matrix.settings.target }}
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: go-${{ matrix.settings.target }}
          zig: ${{ matrix.settings.host == 'ubuntu-latest' }}

      - name: Build (zig, linux)
        if: ${{ matrix.settings.host == 'ubuntu-latest' && contains(matrix.settings.target, 'linux') }}
        working-directory: bindings/c
        run: cargo zigbuild --release --all-features --target ${{ matrix.settings.target }}.${{ env.GLIBC_VERSION }} --locked
      # turso_sdk_kit's build script embeds a Windows version resource, and shells
      # out to a bare `windres` to do it. Cross-compiling from Linux there is no
      # such binary on PATH, so the build panics with NotFound before any Rust is
      # compiled. mingw-w64's binutils supplies one under a target-prefixed name.
      - name: Provide a Windows resource compiler
        if: ${{ contains(matrix.settings.target, 'windows') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-x86-64
          sudo ln -sf /usr/bin/x86_64-w64-mingw32-windres /usr/local/bin/windres
          windres --version | head -1

      - name: Build (zig, windows)
        if: ${{ contains(matrix.settings.target, 'windows') }}
        working-directory: bindings/c
        run: cargo zigbuild --release --all-features --target ${{ matrix.settings.target }} --locked
      - name: Build (native)
        if: ${{ matrix.settings.host != 'ubuntu-latest' }}
        uses: marcopolo/cargo@master
        with:
          working-directory: bindings/c
          args: --release --all-features --target=${{ matrix.settings.target }} --locked
          command: build

      - name: List folder
        run: ls -lh ../../target/${{ matrix.settings.target }}/release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.settings.target }}
          path: target/${{ matrix.settings.target }}/release/libzen_ffi.a
          if-no-files-found: error
  copy-common:
    name: Upload common file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: common
          path: bindings/c/zen_engine.h
          if-no-files-found: error
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    if: "(github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')"
    needs:
      - build
      - copy-common
    steps:
      # Authenticated with a deploy key scoped to phenixrizen/zen-go alone, rather
      # than a personal access token that would carry write access to every
      # repository the owner can reach. persist-credentials keeps the same key
      # available to the push below.
      - name: Checkout zen-go
        uses: actions/checkout@v4
        with:
          repository: phenixrizen/zen-go
          ssh-key: ${{ secrets.ZEN_GO_DEPLOY_KEY }}
          persist-credentials: true
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts
        run: |
          mv artifacts/aarch64-apple-darwin/libzen_ffi.a deps/darwin_arm64/
          mv artifacts/x86_64-apple-darwin/libzen_ffi.a deps/darwin_amd64/
          mv artifacts/aarch64-unknown-linux-gnu/libzen_ffi.a deps/linux_arm64/
          mv artifacts/x86_64-unknown-linux-gnu/libzen_ffi.a deps/linux_amd64/
          mv artifacts/x86_64-pc-windows-gnu/libzen_ffi.a deps/windows_amd64/libzen_ffi.a
          rm -f deps/windows_amd64/libzen_ffi.lib
          mv artifacts/common/zen_engine.h zen_engine.h
          rm -rf artifacts

      # Publishes straight to master and tags it, rather than opening a pull
      # request. A 94MB machine-generated archive cannot be meaningfully reviewed,
      # and the branch-and-wait flow left a rebuilt XCFramework sitting unmerged
      # for hours because nobody knew it was there. This runs only on a release
      # tag, after all five platform builds have passed.
      - name: Commit and push to master
        run: |
          git config user.email "phenixrizen@gmail.com"
          git config user.name "Phenix Rizen"
          git add .
          if git diff --cached --quiet; then
            echo "no dependency changes; nothing to publish" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: update deps for ${{ github.ref_name }}"
          git push origin HEAD:master

      # The tag mirrors the engine release that produced these libraries, so
      # zen-go v2.1.0 is the binding built from zen's go-v2.1.0. Without it Go
      # consumers can only resolve a pseudo-version.
      - name: Tag the release
        if: ${{ github.ref_type == 'tag' }}
        run: |
          VERSION="v${GITHUB_REF_NAME#go-v}"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already tagged on zen-go; leaving it alone" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag -a "$VERSION" \
            -m "$VERSION" \
            -m "Go binding built from ${{ github.ref_name }}."
          git push origin "$VERSION"
          {
            echo "### zen-go $VERSION published"
            echo
            echo "Libraries rebuilt from \`${{ github.ref_name }}\` and pushed to master, tagged \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
